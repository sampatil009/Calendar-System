{% extends "base.html" %}

{% block title %}Calendar{% endblock %}

{% block content %}
<div class="calendar-container">

    <div class="calendar-toolbar">
        <div class="btn-group">
            <button id="prev-btn" class="btn btn-secondary">Previous</button>
            <button id="today-btn" class="btn btn-secondary">Today</button>
            <button id="next-btn" class="btn btn-secondary">Next</button>
        </div>

        <h2 id="calendar-title"></h2>

        <button id="new-event-btn" class="btn btn-primary">New Event</button>
    </div>

    <div class="upload-section">
        <h3>Import Calendar (ICS File)</h3>
        <input type="file" id="ics-file-input" accept=".ics">
        <button id="upload-ics-btn" class="btn btn-primary">Upload ICS</button>
        <span id="upload-status"></span>
    </div>

    <div id="calendar"></div>

    <div id="event-form-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>

            <h3>Create Event</h3>

            <form id="event-form">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="event-title" required>
                </div>

                <div class="form-group">
                    <label>Start</label>
                    <input type="datetime-local" id="event-start" required>
                </div>

                <div class="form-group">
                    <label>End</label>
                    <input type="datetime-local" id="event-end" required>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="event-location">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="event-description"></textarea>
                </div>

                <div class="form-group">
                    <label>Color</label>
                    <input type="color" id="event-color" value="#3788d8">
                </div>

                <label>
                    <input type="checkbox" id="event-all-day"> All Day
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" id="cancel-form-btn" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const calendarView = "{{ view }}";
</script>
<script src="{{ url_for('static', filename='js/calendar.js') }}"></script>
{% endblock %}
